version: "3.8"

services:
  # --- Recommended production database (PostgreSQL) ---
  # The application defaults to SQLite (file backend/data/app.db) so it runs
  # without Docker. Uncomment the PostgreSQL/Neo4j services below and point
  # DATABASE_URL at postgres for a production deployment.
  #
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: threatintel
  #     POSTGRES_USER: threatintel
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #
  # neo4j:
  #   image: neo4j:5-community
  #   environment:
  #     NEO4J_AUTH: neo4j/change-me
  #   volumes:
  #     - neo4j_data:/data
  #   ports:
  #     - "7474:7474"
  #     - "7687:7687"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/data:/app/backend/data
    # depends_on:
    #   - postgres
    #   - neo4j

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  pgdata:
  neo4j_data:
